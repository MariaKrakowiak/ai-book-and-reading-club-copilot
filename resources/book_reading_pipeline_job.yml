resources:

  jobs:

    book_reading_pipeline:

      name: AI Book Reading Club Pipeline

      tasks:

        - task_key: ingest_books

          environment_key: default

          spark_python_task:
            python_file: ../pipeline/ingest_books.py


        - task_key: sync_to_lakebase

          depends_on:
            - task_key: ingest_books

          environment_key: default

          environment_variables_key: lakebase

          spark_python_task:
            python_file: ../pipeline/sync_to_lakebase.py


        - task_key: embed_books

          depends_on:
            - task_key: sync_to_lakebase

          environment_key: default

          environment_variables_key: lakebase

          spark_python_task:
            python_file: ../pipeline/embed_books.py

      environments:

        - environment_key: default

          spec:

            environment_version: "5"

      environment_variables:

        - environment_variables_key: lakebase

          spec:

            variables:

              LAKEBASE_DATABASE_URL: "{{secrets/database/lakebase-url}}"


